services:
  ofscraper-gui:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Which GUI patch version to use at build time.
        # Must match one of the patch_ofscraper_X.X.X_gui.py files in the repo root.
        # Available: 3.12.9, 3.14.3, 3.14.5, 3.14.7, 3.17.1, 3.18.0, 3.18.1
        # (3.17.1 and later have the Fansly tab; 3.18.0 and later can use PostgreSQL)
        GUI_PATCH_VERSION: "3.18.1"
    container_name: ofscraper-gui
    environment:
      # Optional: set your timezone (examples: America/New_York, Europe/London, UTC)
      - TZ=UTC
      # Starting screen size. noVNC resizes it to fit the browser window.
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - NOVNC_PORT=6699
      - VNC_PORT=5900
      # Password for noVNC (browser) and VNC. Blank = no password, as before.
      # With host networking both ports listen on every interface of the host,
      # so set one unless the host is only reachable from a trusted network.
      # VNC uses only the first 8 characters.
      - VNC_PASSWORD=
      # Seconds to wait before relaunching the GUI if it exits/crashes.
      - GUI_RESTART_DELAY=5
      # CLI args appended to "ofscraper --gui" at startup. They go to ONE site:
      # the tab used last, or the one named with --site onlyfans / --site fansly.
      # Leave blank (or remove) to open the GUI without auto-starting a scrape.
      # Example: --site onlyfans --daemon 120 --username ALL -ts --posts all --discord low
      - GUI_ARGS=
      # Start BOTH sites at once (3.17.1 and later): each variable that is set starts that
      # site's tab with its own scrape and its own daemon timer. When either is
      # set, GUI_ARGS is not used. Blank = that site waits for a click in noVNC.
      # Fansly: -ts / --sub-status active keeps only paid subscriptions; creators
      # you follow for free are dropped, so leave it out to scrape them too.
      # Example OnlyFans: --daemon 120 --username ALL -ts --posts all --discord low
      # Example Fansly:   --daemon 120 --username ALL --posts all --discord low
      - ONLYFANS_GUI_ARGS=
      - FANSLY_GUI_ARGS=
      # gui (default): the GUI over noVNC, as above.
      # cli: no GUI, display or VNC; runs "ofscraper CLI_ARGS" instead.
      #   Meant for --daemon runs (a one-shot run would be restarted by
      #   "restart: unless-stopped"; use "docker compose run --rm" for those).
      #   docker stop shuts the daemon down cleanly;
      #   "docker kill --signal=USR1 ofscraper-gui" starts the next run now.
      - MODE=gui
      # Optional PostgreSQL database (3.18.0 and later; the image has the driver).
      # Blank or removed = the usual user_data.db files. A connection saved in
      # the GUI (Manage DBs -> PostgreSQL) replaces this one. See docs/postgresql.md.
      # Example: postgresql://user:password@host:5432/database
      # - OFSC_DATABASE_URL=
      # CLI args for MODE=cli.
      # Example: --daemon 120 --username ALL --posts all --action download
      - CLI_ARGS=
      # ── Qt/rendering performance in Docker ──────────────────────────────────
      # Use Qt's built-in 2D software rasterizer instead of llvmpipe (Mesa software
      # OpenGL). For a widget-only app, Qt's own painter is faster and uses far less CPU.
      - QT_OPENGL=software
      # Ensure Mesa software rendering is used as fallback (belt-and-suspenders with
      # the LIBGL_ALWAYS_SOFTWARE set by the app's Docker detection code).
      - LIBGL_ALWAYS_SOFTWARE=1
      # Silence verbose Qt debug output that can slow down the event loop.
      - QT_LOGGING_RULES=*.debug=false;qt.qpa.*=false
    volumes:
      # ╔════════════════════════════════════════════════════════════════════════╗
      # ║  CHANGE ME — replace every /home/YOU/... host path below with yours    ║
      # ║  Left side = path on the Docker HOST    Right side = path in container ║
      # ╚════════════════════════════════════════════════════════════════════════╝
      #
      # 1) REQUIRED — ofscraper config (auth.json, config.json, SQLite DBs,
      #    logging/, gui_crash_logs/, device/ for CDM keys).
      #    The right side MUST be /root/.config/ofscraper: ofscraper runs as root
      #    and only reads ~/.config/ofscraper (config, auth, DBs, plugins/).
      #    Mount 2 below does NOT replace this one.
      #    Put Widevine CDM keys here for the container-native path:
      #      …/device/client_id.bin
      #      …/device/private_key.pem
      - /home/YOU/.config/ofscraper:/root/.config/ofscraper
      #
      # 2) OPTIONAL — only if config.json already stores absolute paths under your
      #    host home (e.g. CDM keys at /home/YOU/.config/ofscraper/client_id.bin).
      #    Keep left and right identical so those paths resolve without rewriting
      #    config.json. Comment out if you only use the /root/.config mount above.
      #    This is an extra mount, not a replacement for mount 1: ofscraper never
      #    looks here on its own, only at paths config.json points to.
      - /home/YOU/.config/ofscraper:/home/YOU/.config/ofscraper
      #
      # 3) REQUIRED — download / Save Location folders. The container path (right)
      #    must match file_options.save_location in each site's config.json:
      #    OnlyFans: config.json   Fansly: fansly/config.json (both in mount 1).
      #    A site left on its default saves to /root/Data/ofscraper/<site>,
      #    which isn't on a volume: downloads there are lost when the
      #    container is recreated. Mounting one parent folder (e.g.
      #    /home/YOU/Photos) covers both sites' folders under it.
      - /home/YOU/Photos/OnlyFans:/home/YOU/Photos/OnlyFans
      - /home/YOU/Photos/Fansly:/home/YOU/Photos/Fansly
      #
      # ffmpeg is installed natively in the container (see Dockerfile) — do not
      # bind-mount a host ffmpeg binary (it often breaks DRM remux in the image).
    # Fast temporary RAM storage for segmented downloads and Widevine decryption
    tmpfs:
      - /tmp:exec,mode=777
    # Host networking: the container shares the host's network stack directly,
    # eliminating Docker's NAT (iptables) for all API calls. On a 99k-item scrape
    # this removes the per-connection NAT overhead on every OnlyFans API request.
    # With host networking the noVNC port is exposed on the host directly:
    #   open http://<host>:6699/ — no port mapping needed or allowed.
    # NOTE: host network_mode only works on Linux Docker hosts.
    # On Docker Desktop (Mac/Windows), remove this line and restore the ports: block below.
    network_mode: host
    # ports:  # Not used with network_mode: host — remove the above line to restore
    #   - "6699:6699"
    restart: unless-stopped
    # docker stop asks OF-Scraper to cancel the current scrape and exit; give
    # it time to finish in-flight work before Docker falls back to SIGKILL.
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # 2 GB of shared memory for Qt and the in-app browser (Chromium).
    shm_size: "2g"
    # No memory limit (0 = unlimited). To cap it, set e.g. mem_limit: 8g.
    mem_limit: 0
    memswap_limit: 0
