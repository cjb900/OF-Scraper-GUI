name: codecov
permissions: read-all
on:
  push:
    branches: main
    # Publish semver tags as releases.
    tags: [v*.*.*]
  pull_request:
    branches: main

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the versions the README supports (3.11.x and 3.12.x)
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        # the project (pyproject.toml, uv.lock) lives in the version folder
        working-directory: OF-Scraper-3.14.7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen --extra test
      - name: create required folder
        run: mkdir -p /home/runner/.config/ofscraper/main_profile
      - name: Run tests and collect coverage
        run: uv run --frozen pytest --cov=ofscraper --cov-report term --cov-report xml:coverage.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: OF-Scraper-3.14.7/coverage.xml
          fail_ci_if_error: false
