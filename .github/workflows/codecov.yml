name: tests
permissions: read-all
on:
  push:
    branches: [main, testing]
    # Publish semver tags as releases.
    tags: [v*.*.*]
  pull_request:
    branches: [main, testing]
  # "Run workflow" button in the Actions tab
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.17.1 supports 3.11 and up; 3.15 is left out because lz4 has no
        # wheels for it yet and needs a C compiler.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        # the project (pyproject.toml, uv.lock) lives in the version folder
        working-directory: OF-Scraper-3.17.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt system libraries and FFmpeg
        # the GUI tests run headless (offscreen) but PyQt6 still loads these;
        # ffmpeg is needed by the DRM decrypt test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libdbus-1-3 libfontconfig1 libfreetype6 libglib2.0-0t64 libxkbcommon0 \
            ffmpeg
      - name: Install dependencies
        # gui: without PyQt6 every GUI test file skips itself
        run: uv sync --locked --extra test --extra gui
      - name: create required folder
        run: mkdir -p /home/runner/.config/ofscraper/main_profile
      - name: Check Qt loads
        # fail here rather than letting the GUI tests skip quietly
        run: uv run --frozen python -c "from PyQt6.QtWidgets import QApplication; QApplication([])"
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Run tests
        # the GUI patch's tests. test/ also holds upstream's own suite, which
        # tests stock 3.17.1 (placeholder URLs, unpatched headers) and isn't
        # expected to pass against the patched tree.
        # The coverage table is printed in the log (not uploaded anywhere).
        run: uv run --frozen pytest test/unit --cov=ofscraper --cov-report term
        env:
          QT_QPA_PLATFORM: offscreen
