name: codecov
permissions: read-all
on:
  push:
    branches: [main, testing]
    # Publish semver tags as releases.
    tags: [v*.*.*]
  pull_request:
    branches: [main, testing]
  # "Run workflow" button in the Actions tab
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11/3.12: what the README supports for the patch install.
        # 3.13/3.14: allowed for source installs since requires-python <3.16.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        # the project (pyproject.toml, uv.lock) lives in the version folder
        working-directory: OF-Scraper-3.14.7
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt system libraries
        # the GUI tests run headless (offscreen) but PyQt6 still loads these
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libx11-6 libdbus-1-3 libfontconfig1 libfreetype6 libglib2.0-0t64 libxkbcommon0
      - name: Install dependencies
        # gui: without PyQt6 every GUI test file skips itself
        run: uv sync --locked --extra test --extra gui
      - name: create required folder
        run: mkdir -p /home/runner/.config/ofscraper/main_profile
      - name: Check Qt loads
        # fail here rather than letting the GUI tests skip quietly
        run: uv run --frozen python -c "from PyQt6.QtWidgets import QApplication; QApplication([])"
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Run tests and collect coverage
        run: uv run --frozen pytest --cov=ofscraper --cov-report term --cov-report xml:coverage.xml
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: OF-Scraper-3.14.7/coverage.xml
          fail_ci_if_error: false
